<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Code-blind simulator QA: testing without source context</title>
  <desc id="desc">A comparison of an orchestrator with source and build context and a tester who sees only the running simulator.</desc>

  <rect width="1280" height="640" fill="#F4F2EC"/>

  <g fill="#25282A" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="55" font-size="17" font-weight="600">Code-blind simulator QA</text>
  </g>
  <line x1="72" y1="80" x2="1208" y2="80" stroke="#D4D2CA" stroke-width="1"/>

  <rect x="72" y="117" width="40" height="4" fill="#B7F326"/>
  <text x="72" y="183" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.2" fill="#25282A">Testing without source context</text>
  <text x="72" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#626662">The build owner has source context. The tester sees only the running app.</text>

  <line x1="72" y1="258" x2="1208" y2="258" stroke="#25282A" stroke-width="1"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="301" font-size="15" font-weight="500" fill="#626662">Source + build</text>
    <text x="696" y="301" font-size="15" font-weight="500" fill="#626662">Simulator only</text>

    <text x="72" y="350" font-size="34" font-weight="600" fill="#25282A">Orchestrator</text>
    <text x="696" y="350" font-size="34" font-weight="600" fill="#25282A">Tester</text>

    <text x="72" y="386" font-size="18" font-weight="400" fill="#626662">Can inspect implementation and configuration.</text>
    <text x="696" y="386" font-size="18" font-weight="400" fill="#626662">Can observe screens and interactions.</text>

    <text x="72" y="444" font-size="14" font-weight="500" fill="#777A74">Evidence before testing</text>
    <text x="72" y="475" font-size="17" font-weight="400" fill="#25282A">source · configuration · runtime behavior</text>

    <text x="696" y="444" font-size="14" font-weight="500" fill="#777A74">Evidence during testing</text>
    <text x="696" y="475" font-size="17" font-weight="400" fill="#25282A">screens · state changes · interaction results</text>
  </g>

  <line x1="640" y1="286" x2="640" y2="501" stroke="#C9CBC4" stroke-width="1"/>

  <line x1="72" y1="545" x2="1208" y2="545" stroke="#D4D2CA" stroke-width="1"/>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="72" y="588" font-size="18" font-weight="500" fill="#25282A">The tester does not receive source context.</text>
    <text x="1208" y="588" text-anchor="end" font-size="14" font-weight="400" fill="#777A74">Runtime evidence only</text>
  </g>
</svg>
